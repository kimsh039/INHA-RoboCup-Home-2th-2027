# robot_localization EKF: wheel forward speed (/odom, driver v4) + bias-removed Mid-360S gyro (/imu/base).
# Run:  python3 imu_base_relay.py   and
#       ros2 run robot_localization ekf_node --ros-args --params-file ekf_odom_imu.yaml -r odometry/filtered:=/odom_ekf
# TF is off (tracer_base publishes odom -> base_link); set publish_tf: true and turn the driver TF off to use it.
ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: false
    map_frame: map
    odom_frame: odom_ekf
    base_link_frame: base_link
    world_frame: odom_ekf

    # wheels: vx and vy (vy = 0 for a differential base); wheel yaw rate is not used (it drifts between sessions)
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # IMU: yaw rate only
    imu0: /imu/base
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: true

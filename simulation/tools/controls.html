<!doctype html><html lang="ko"><meta charset="utf-8"><title>로봇 Gazebo 조작</title><style>body{font:16px sans-serif;background:#f3f5fa;color:#202b3b;max-width:700px;margin:30px auto;padding:20px}section{background:white;border-radius:14px;padding:24px;margin:20px 0}button{padding:12px 18px;margin:5px;border:0;border-radius:8px;background:#176bea;color:white;font-size:16px;cursor:pointer}input{width:65%}label{display:block;margin:18px 0}#status{color:#346}</style><h1>Tracer + Piper 조작</h1><p>Gazebo 시뮬레이션 창을 보면서 조작하세요.</p><section><h2>Tracer 주행</h2><p>각 버튼은 1초 동안 움직인 뒤 자동 정지합니다.</p><button onclick="drive(.15,0)">전진</button><button onclick="drive(-.15,0)">후진</button><button onclick="drive(0,.4)">좌회전</button><button onclick="drive(0,-.4)">우회전</button><button style="background:#d43232" onclick="drive(0,0)">정지</button></section><section><h2>Piper 팔</h2><p>슬라이더를 놓으면 해당 관절이 움직입니다. 단위: rad.</p><div id="joints"></div><button onclick="home()">관절 원점</button><h3>그리퍼</h3><button onclick="send({type:'grip',q:.035})">열기</button><button onclick="send({type:'grip',q:0})">닫기</button></section><p id="status">준비됨</p><script>const limits=[[-2.617,2.617],[0,3.141],[-2.967,0],[-1.745,1.745],[-1.221,1.221],[-2.094,2.094]];limits.forEach((r,k)=>{let i=k+1;document.getElementById('joints').insertAdjacentHTML('beforeend',`<label>관절 ${i} <input id="j${i}" aria-label="관절 ${i}" type="range" min="${r[0]}" max="${r[1]}" step=".001" value="0" oninput="document.getElementById('q${i}').textContent=this.value" onchange="send({type:'joint',i:${i},q:Number(this.value)})"> <span id="q${i}">0</span></label>`)});async function send(a){try{let r=await fetch('/command',{method:'POST',body:JSON.stringify(a)});document.getElementById('status').textContent=r.ok?'명령 전송 완료':await r.text()}catch(e){document.getElementById('status').textContent='제어 서버 연결 실패'}}function drive(v,w){send({type:'drive',v,w})}async function home(){for(let i=1;i<=6;i++){document.getElementById('j'+i).value=0;document.getElementById('q'+i).textContent=0;await send({type:'joint',i,q:0})}}</script></html>
